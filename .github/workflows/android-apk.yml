name: Bakım Takip - Android APK

on:
  push:
    branches: [main]
    paths:
      - "bakim-takip-mobile/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bakim-takip-mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install web deps
        run: npm install

      - name: Sync web assets into native Android project
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: bakim-takip-mobile/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bakim-takip-debug-apk
          path: bakim-takip-mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
