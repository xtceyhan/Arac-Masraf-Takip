name: Android APK Derle

on:
  push:
    branches:
      - main
      - "claude/**"
    paths:
      - "bakim-takip-mobile/**"
      - ".github/workflows/build-android-apk.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bakim-takip-mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Capacitor sync
        run: npx cap sync android

      - name: Build debug APK
        working-directory: bakim-takip-mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/bakim-takip.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: bakim-takip-apk
          path: bakim-takip-mobile/android/app/build/outputs/apk/debug/bakim-takip.apk

      - name: Read app version
        id: ver
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Prepare release notes
        id: relnotes
        run: |
          {
            echo 'notes<<RELEASE_NOTES_EOF'
            echo "Otomatik olarak derlenen en güncel Android APK dosyası (v${{ steps.ver.outputs.version }})."
            echo "Tablete/telefona indirip kurabilirsin (bilinmeyen kaynaklardan yükleme izni gerekebilir)."
            echo ""
            echo "### Son güncelleme ($(git log -1 --format=%cd --date=short))"
            git log -1 --pretty=%B | grep -v -E '^(Co-Authored-By|Claude-Session):'
            echo ""
            echo "Tüm sürüm geçmişi: [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)"
            echo 'RELEASE_NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-apk
          name: "Bakım Takip - Android APK (v${{ steps.ver.outputs.version }})"
          body: ${{ steps.relnotes.outputs.notes }}
          make_latest: true
          files: bakim-takip-mobile/android/app/build/outputs/apk/debug/bakim-takip.apk
